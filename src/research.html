<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jack Ruan | Interested Research</title>

  <!-- Google Fonts: Pirata One + Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pirata+One&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />
  <script>
    // Immediate Theme Check (must run before paint to prevent flash)
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <div class="container">

    <div id="navbar-placeholder"></div>
      
      <div class="section">
        <main>
        <h1>Interested Research</h1>

        <div class="tabs">
          <button class="tab-btn active" data-tab="ai">AI</button>
          <button class="tab-btn" data-tab="edtech">Education Technology</button>
          <button class="tab-btn" data-tab="fittech">Fitness Technology</button>
        </div>

        <div class="tab-panel active" id="tab-ai">
          <a href="https://arxiv.org/abs/2309.14459" target="_blank" rel="noopener noreferrer" class="research-card">
            <div class="research-card-body">
              <span class="research-tag">HCI &middot; LLM</span>
              <h3>Bridging the Gulf of Envisioning: Cognitive Design Challenges in LLM Interfaces</h3>
            </div>
            <i class="bi bi-arrow-up-right research-card-icon"></i>
          </a>
        </div>

        <div class="tab-panel" id="tab-edtech">
          <a href="https://journals.sagepub.com/eprint/UMU4DJUBGNRTAHRYA4X4/full" target="_blank" rel="noopener noreferrer" class="research-card">
            <div class="research-card-body">
              <span class="research-tag">EdTech &middot; GenAI</span>
              <h3>Generative AI enhances individual creativity but reduces the collective diversity of novel content</h3>
            </div>
            <i class="bi bi-arrow-up-right research-card-icon"></i>
          </a>
        </div>

        <div class="tab-panel" id="tab-fittech">
          <p class="tab-empty">Papers coming soon.</p>
        </div>
        </main>
      </div>

    <div id="footer-placeholder"></div>
  </div>

  <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Deactivate all tabs and panels
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

        // Activate clicked tab and its panel
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });
  </script>

</body>
</html>
